<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receiving Tool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F5F1E9;
    --surface:#FFFFFF;
    --surface-2:#FBF8F2;
    --border:#E3DBC9;
    --ink:#211E19;
    --muted:#756D5D;
    --accent:#B5561E;
    --accent-ink:#FFFFFF;
    --garnish:#3C7A56;
    --garnish-soft:#E6F1EA;
    --juice:#B08900;
    --juice-soft:#F5ECC7;
    --beer:#A9720E;
    --beer-soft:#F6EAD1;
    --spirit:#6C4A82;
    --spirit-soft:#EFE7F4;
    --danger:#B23B3B;
    --danger-soft:#F6E3E1;
    --focus:#1C6FBB;
    --shadow:0 1px 2px rgba(33,30,25,.06), 0 6px 16px rgba(33,30,25,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17150F; --surface:#201D17; --surface-2:#251F17; --border:#3A3324;
      --ink:#F2EDE1; --muted:#AEA48F; --accent:#E28A45; --accent-ink:#1C1006;
      --garnish:#69BB8E; --garnish-soft:#1E2D24; --juice:#E6C34A; --juice-soft:#332C12;
      --beer:#E3AC4C; --beer-soft:#332711;
      --spirit:#BFA0D8; --spirit-soft:#2B2233; --danger:#E28E8E; --danger-soft:#33211E;
      --focus:#7BB6EA; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17150F; --surface:#201D17; --surface-2:#251F17; --border:#3A3324;
    --ink:#F2EDE1; --muted:#AEA48F; --accent:#E28A45; --accent-ink:#1C1006;
    --garnish:#69BB8E; --garnish-soft:#1E2D24; --juice:#E6C34A; --juice-soft:#332C12;
    --beer:#E3AC4C; --beer-soft:#332711;
    --spirit:#BFA0D8; --spirit-soft:#2B2233; --danger:#E28E8E; --danger-soft:#33211E;
    --focus:#7BB6EA; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    padding-inline:16px; padding-block:0 40px;
    max-width:820px; margin-inline:auto;
  }
  h1,h2,h3{font-family:'Oswald',system-ui,sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0;}
  input,select,button{font-family:inherit; font-size:15px;}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  input:disabled{opacity:.5; cursor:not-allowed;}

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg);
    padding-block:16px 8px; z-index:20; border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .brand-mark{
    width:40px; height:40px; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif;
    font-weight:700; font-size:16px; flex:none;
  }
  .brand h1{font-size:20px;}
  .brand-sub{margin:2px 0 0; color:var(--muted); font-size:12.5px;}

  .tabs{display:flex; gap:6px;}
  .tab-btn{
    flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--muted); font-weight:600; letter-spacing:.02em; cursor:pointer;
  }
  .tab-btn[aria-selected="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  main{padding-top:18px;}

  .meta-strip{
    display:flex; flex-wrap:wrap; gap:8px 18px; padding:10px 14px; margin-bottom:16px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    font-size:13px; color:var(--muted);
  }
  .meta-strip strong{color:var(--ink); font-weight:600;}

  .cat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    margin-bottom:18px; box-shadow:var(--shadow); overflow:hidden;
  }
  .cat-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); }
  .cat-head h2{font-size:16px;}
  .cat-tag{
    font-family:'Inter',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; padding:4px 9px; border-radius:999px;
  }
  .cat-card--garnish .cat-head{border-top:4px solid var(--garnish);}
  .cat-card--garnish .cat-tag{background:var(--garnish-soft); color:var(--garnish);}
  .cat-card--juice .cat-head{border-top:4px solid var(--juice);}
  .cat-card--juice .cat-tag{background:var(--juice-soft); color:var(--juice);}
  .cat-card--beer .cat-head{border-top:4px solid var(--beer);}
  .cat-card--beer .cat-tag{background:var(--beer-soft); color:var(--beer);}
  .cat-card--spirit .cat-head{border-top:4px solid var(--spirit);}
  .cat-card--spirit .cat-tag{background:var(--spirit-soft); color:var(--spirit);}

  .item-list{padding:6px 16px 14px;}
  .item-block{padding:12px 0; border-bottom:1px dashed var(--border);}
  .item-block:last-child{border-bottom:none;}
  .item-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .item-head h3{font-size:13.5px; letter-spacing:.01em;}
  .item-hint{font-size:11px; color:var(--muted); line-height:1.45; margin:-4px 0 8px;}
  .add-btn{
    border:1px dashed var(--border); background:transparent; color:var(--accent); font-weight:600;
    font-size:12.5px; padding:6px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  }
  .add-btn:hover{background:var(--surface-2);}
  .area-btns{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px;}
  .add-btn--area{font-size:11.5px; padding:5px 9px;}

  .rows{display:flex; flex-direction:column; gap:8px;}
  .entry-row{ display:grid; grid-template-columns:64px 1fr 28px; align-items:center; gap:8px; }
  .entry-row--juice{grid-template-columns:64px 1fr 1fr 28px;}
  .entry-index{font-size:12px; color:var(--muted); font-weight:600;}
  .field{
    position:relative; display:flex; align-items:center; background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; padding:0 10px;
  }
  .field input{
    flex:1; min-width:0; border:none; background:transparent; padding:9px 4px; color:var(--ink);
    font-variant-numeric:tabular-nums; font-weight:600;
  }
  .field input::placeholder{color:var(--muted); font-weight:400;}
  .field .unit{font-size:11px; color:var(--muted); white-space:nowrap; padding-left:4px;}
  .open-count-wrap{margin-top:6px; max-width:140px;}
  .sub-field-label{display:block; font-size:10px; color:var(--muted); margin-bottom:4px;}

  /* ---- alcohol: stacked open/full bottle groups ---- */
  .entry-row.bottle-group{
    display:block; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:12px;
  }
  .bottle-group-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .bottle-sub{margin-bottom:10px;}
  .bottle-sub:last-child{margin-bottom:0;}
  .bottle-sub-label{
    display:block; font-size:10.5px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;
  }
  .bottle-sub-row{display:grid; grid-template-columns:84px 1fr; gap:8px; align-items:center;}
  @media (max-width:380px){ .bottle-sub-row{grid-template-columns:1fr;} }
  .config-missing{
    display:block; font-size:11px; font-weight:600; color:var(--danger);
    background:var(--danger-soft); border-radius:7px; padding:6px 9px; margin-top:6px;
  }
  .config-missing[hidden]{display:none;}
  select.input-size{
    padding:9px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink); font-weight:600; font-size:13px;
  }
  .row-remove{
    width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--surface);
    color:var(--muted); cursor:pointer; font-size:16px; line-height:1;
  }
  .row-remove:hover{background:var(--danger-soft); color:var(--danger); border-color:var(--danger-soft);}
  .row-remove[hidden]{visibility:hidden;}

  @media (max-width:520px){
    .entry-row--juice{grid-template-columns:1fr 1fr; grid-template-areas:"idx remove" "open open" "closed closed";}
    .entry-row--juice .entry-index{grid-area:idx;}
    .entry-row--juice .field:nth-of-type(1){grid-area:open;}
    .entry-row--juice .field:nth-of-type(2){grid-area:closed;}
    .entry-row--juice .row-remove{grid-area:remove; justify-self:end;}
  }

  /* ---- setup: reference fields ---- */
  .ref-row{display:grid; grid-template-columns:1fr; gap:8px;}
  .ref-row--pair{grid-template-columns:1fr 1fr;}
  .ref-row--trio{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:420px){ .ref-row--trio{grid-template-columns:1fr 1fr;} }
  .ref-row--size{display:grid; grid-template-columns:56px 1fr 1fr; align-items:center; gap:8px; margin-bottom:6px;}
  .ref-row--size:last-child{margin-bottom:0;}
  .size-chip{
    font-size:11.5px; font-weight:700; color:var(--muted); background:var(--surface-2);
    border:1px solid var(--border); border-radius:7px; padding:8px 6px; text-align:center;
  }
  .setup-grid{display:grid; grid-template-columns:1fr; max-width:220px; gap:12px; margin-bottom:16px;}
  .field-block{display:flex; flex-direction:column; gap:6px;}
  .field-block.full{grid-column:1/-1;}
  label.f-label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .field-block input, .field-block textarea{
    padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  }
  .field-block textarea{resize:vertical; min-height:64px;}
  .counter-block{margin-bottom:14px;}
  @media (max-width:480px){ .setup-grid{grid-template-columns:1fr;} }

  .status-note{
    margin-top:4px; margin-bottom:18px; padding:11px 14px; border-radius:10px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--muted); font-size:12.5px; line-height:1.5;
  }

  .action-bar{
    position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--surface); border-top:1px solid var(--border); display:flex; gap:10px;
    max-width:820px; margin-inline:auto; z-index:30; box-shadow:0 -6px 16px rgba(33,30,25,.06);
  }
  .btn{ flex:1; padding:12px 14px; border-radius:10px; font-weight:700; letter-spacing:.02em; cursor:pointer; border:1px solid transparent; }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:var(--surface); color:var(--ink); border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-2);}

  main{padding-bottom:96px;}

  #results{margin-top:6px;}
  .result-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px;
    margin-bottom:14px; box-shadow:var(--shadow);
  }
  .result-card h2{font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .dot--garnish{background:var(--garnish);} .dot--juice{background:var(--juice);} .dot--beer{background:var(--beer);} .dot--spirit{background:var(--spirit);}
  .result-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:7px 0; border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .result-row:last-of-type{border-bottom:none;}
  .result-row .rv{font-variant-numeric:tabular-nums; font-weight:700; text-align:right;}
  .flag{display:block; font-size:10.5px; font-weight:500; color:var(--danger); margin-top:2px;}
  .export-wrap{display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:6px;}
  .btn-export{
    background:var(--ink); color:var(--bg); border:none; padding:13px 26px; border-radius:10px;
    font-weight:700; letter-spacing:.02em; cursor:pointer; font-size:14.5px;
  }
  .export-hint{color:var(--muted); font-size:12px; text-align:center;}
  #toast{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(10px); background:var(--ink);
    color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; opacity:0;
    pointer-events:none; transition:opacity .2s, transform .2s; z-index:40;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  [hidden]{display:none!important;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">RT</span>
    <div>
      <h1>Receiving Tool</h1>
      <p class="brand-sub">Initial inventory count</p>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-btn-report" class="tab-btn" aria-selected="true">Report</button>
    <button type="button" role="tab" id="tab-btn-setup" class="tab-btn" aria-selected="false">Setup</button>
  </nav>
</header>

<main>
  <section id="panel-report">
    <div class="field-block counter-block">
      <label class="f-label" for="r-counter">Counted by</label>
      <input id="r-counter" type="text" placeholder="Name of the person counting">
    </div>
    <div class="meta-strip">
      <span id="meta-date">No date set</span>
    </div>
    <div id="categories-report"></div>
  </section>

  <section id="panel-setup" hidden>
    <div id="setup-content">
      <div class="setup-grid">
        <div class="field-block">
          <label class="f-label" for="s-date">Count date</label>
          <input id="s-date" type="date">
        </div>
      </div>

      <p class="status-note" id="storage-status">Checking where reference weights are saved...</p>

      <div id="categories-setup"></div>
    </div>
  </section>

  <section id="results" hidden></section>
</main>

<div class="action-bar">
  <button type="button" class="btn btn-ghost" id="btn-reset">Reset</button>
  <button type="button" class="btn btn-primary" id="btn-calc">Calculate</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";


  // Approximate density for beer used only when a reference weight is
  // missing (fallback path). Real conversions use the empty/full
  // reference weights entered in Setup instead.
  var DENSITY_KG_PER_L = 0.95;

  var GARNISH_HINT = "Check the keg fridge door — daily-use report sheet.";
  var GARNISH_ITEMS = [
    {key:"lemon", name:"Lemon Fresh EA", kind:"eacount", label:"Report", addText:"+ Add report", hint:GARNISH_HINT},
    {key:"lime",  name:"Lime Fresh EA",  kind:"eacount", label:"Report", addText:"+ Add report", hint:GARNISH_HINT},
    {key:"mint",  name:"Mint Fresh Bag", kind:"bag", label:"Bag", addText:"+ Add bag"}
  ];
  var BEER_ITEMS = [
    {key:"stella",     name:"Stella"},
    {key:"corona",     name:"Corona"},
    {key:"guinness",   name:"Guinness"},
    {key:"kronemburg", name:"Kronemburg"},
    {key:"asahi",      name:"Asahi"},
    {key:"modelo",     name:"Modelo"},
    {key:"juicyass",   name:"Juicy Ass"},
    {key:"jellyking",  name:"Jelly King"},
    {key:"partydad",   name:"Party Dad"},
    {key:"bellweiser", name:"Bellweiser"},
    {key:"michelob",   name:"Michelob"},
    {key:"nobaddaze",  name:"No Bad Daze"},
    {key:"gooseisland",name:"Goose Island"},
    {key:"naughtyneighbour", name:"Naughty Neighbour"}
  ];
  var SPIRIT_ITEMS = [
    {key:"josetradicional", name:"Jose Tradicional"},
    {key:"ketelone", name:"Ketel One"},
    {key:"josegold", name:"Jose Gold"},
    {key:"tanqueray",name:"Tanqueray"}
  ];
  var JUICE_ITEMS = [
    {key:"limejuice",  name:"Lime Juice",  kind:"eabox", label:"EA", addText:"+ Add EA"},
    {key:"lemonjuice", name:"Lemon Juice", kind:"eabox", label:"EA", addText:"+ Add EA"}
  ];
  var SIZES = [
    {value:"0.75", label:"750 ml", slug:"0_75"},
    {value:"1.14", label:"1.14 L", slug:"1_14"},
    {value:"1.75", label:"1.75 L", slug:"1_75"}
  ];
  // Alcohol List Check counts are broken down by physical area instead of
  // a generic "Bottle N" list. H Bar is the main area (the default row);
  // the other four are added on demand with their own buttons.
  var ALCOHOL_AREAS = [
    {key:"hbar", name:"H Bar"},
    {key:"gbar", name:"G Bar"},
    {key:"mbar", name:"M Bar"},
    {key:"prep", name:"Prep"},
    {key:"ccan", name:"CCAN"}
  ];
  function areaNameFor(areaKey){
    var found = ALCOHOL_AREAS.filter(function(a){ return a.key === areaKey; })[0];
    return found ? found.name : areaKey;
  }

  function h(tag, attrs, children){
    var el = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ el.appendChild(c); });
    return el;
  }
  function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
  function fmt(n){
    return (Math.round((n||0) * 100) / 100).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function hasRef(ref){ return !!ref && ((ref.full || 0) - (ref.empty || 0)) > 0; }
  function hasBeerRef(ref){ return hasRef(ref) && (ref.liters || 0) > 0; }

  /* =========================================================
     REFERENCE WEIGHTS (Setup) — shared via the db capability
     when available, otherwise saved to this browser only.
     ========================================================= */
  function defaultRefs(){
    var garnish={}, beer={}, spirits={};
    GARNISH_ITEMS.forEach(function(i){ if (!i.kind || i.kind === "box") garnish[i.key] = {full:0}; });
    BEER_ITEMS.forEach(function(i){ beer[i.key] = {empty:0, full:0, liters:0}; });
    SPIRIT_ITEMS.forEach(function(i){
      var sizes = {};
      SIZES.forEach(function(s){ sizes[s.value] = {empty:0, full:0}; });
      spirits[i.key] = sizes;
    });
    // Factory-seeded reference weights (kg). Anything not listed here
    // stays at 0/0 ("no reference") until someone fills it in on Setup.
    var seed = {
      josetradicional: { "0.75": {empty:0.63, full:1.34} },
      josegold:        { "1.14": {empty:0.72, full:1.79}, "0.75": {empty:0.52, full:1.24} },
      tanqueray:       { "1.14": {empty:0.65, full:1.73} },
      ketelone:        { "1.14": {empty:0.68, full:1.76} }
    };
    Object.keys(seed).forEach(function(key){
      if (!spirits[key]) return;
      Object.keys(seed[key]).forEach(function(size){
        if (spirits[key][size]) spirits[key][size] = seed[key][size];
      });
    });
    // Factory-seeded keg reference weights (kg) plus each keg's actual
    // full volume in liters — kegs of the same kg capacity can hold very
    // different volumes, so liters must be set per keg, not derived from kg.
    var beerSeed = {
      asahi:            {empty:4.71,  full:23.8, liters:20},
      bellweiser:       {empty:9.06,  full:38.5, liters:30},
      corona:           {empty:14.44, full:73.1, liters:58.6},
      juicyass:         {empty:7.79,  full:38.6, liters:30},
      gooseisland:      {empty:14.4,  full:73.4, liters:58.6},
      guinness:         {empty:12.04, full:62.2, liters:50},
      jellyking:        {empty:9.05,  full:38.6, liters:30},
      kronemburg:       {empty:14.4,  full:74,   liters:58.6},
      michelob:         {empty:14.25, full:72.8, liters:58.6},
      modelo:           {empty:14.45, full:74.4, liters:58.6},
      naughtyneighbour: {empty:14.4,  full:74,   liters:58.6},
      nobaddaze:        {empty:14.4,  full:73.3, liters:58.6},
      partydad:         {empty:14.4,  full:74,   liters:58.6},
      stella:           {empty:14.15, full:73.3, liters:58.6}
    };
    Object.keys(beerSeed).forEach(function(key){
      if (beer[key]) beer[key] = beerSeed[key];
    });
    return {garnish:garnish, beer:beer, spirits:spirits};
  }
  var REFS = defaultRefs();
  var REFS_LOCAL_KEY = "receiving-tool-refs-v2";
  var dbCap = null, downloadsCap = null;

  function mergeRefs(data){
    if (!data) return;
    if (data.garnish) for (var g in data.garnish) if (REFS.garnish[g]) REFS.garnish[g] = Object.assign({}, REFS.garnish[g], data.garnish[g]);
    if (data.beer) for (var b in data.beer) if (REFS.beer[b]) REFS.beer[b] = Object.assign({}, REFS.beer[b], data.beer[b]);
    if (data.spirits) for (var s in data.spirits) if (REFS.spirits[s]) {
      for (var sz in data.spirits[s]) if (REFS.spirits[s][sz]) REFS.spirits[s][sz] = Object.assign({}, REFS.spirits[s][sz], data.spirits[s][sz]);
    }

  /* =========================================================
     AVAILABILITY — an item/size with no Setup reference cannot
     have a weight entered for it: the field is disabled and
     shows "No reference" until Setup provides one.
     ========================================================= */
  function bestOpenSizeFor(itemKey){
    var refs = REFS.spirits[itemKey];
    if (refs) for (var i = 0; i < SIZES.length; i++){
      if (hasRef(refs[SIZES[i].value])) return SIZES[i].value;
    }
    return SIZES[0].value;
  }

  function applySpiritOpenAvailability(row, itemKey, selectEl){
    var size = selectEl.value;
    var ref = (REFS.spirits[itemKey] && REFS.spirits[itemKey][size]) || {empty:0, full:0};
    var ok = hasRef(ref);
    var kgInput = row.querySelector(".input-open-kg");
    var countInput = row.querySelector(".input-open-count");
    var msg = row.querySelector(".config-missing");
    kgInput.disabled = !ok;
    countInput.disabled = !ok;
    kgInput.placeholder = ok ? "0.00" : "Not available";
    countInput.placeholder = ok ? "1" : "—";
    if (!ok){ kgInput.value = ""; countInput.value = ""; }
    if (msg) msg.hidden = ok;
  }

  // Works from an element already in the live document (e.g. the user
  // changing the size dropdown): it looks up its own row/item ancestors.
  // Freshly built rows aren't attached yet when spiritRow() runs, so they
  // call applySpiritOpenAvailability() directly instead (see spiritRow).
  function updateSpiritOpenAvailability(selectEl){
    var row = selectEl.closest(".bottle-group");
    var itemBlock = selectEl.closest(".item-block");
    if (!row || !itemBlock) return;
    applySpiritOpenAvailability(row, itemBlock.dataset.itemKey, selectEl);
  }

    document.querySelectorAll('#categories-report .cat-card--spirit .input-open-size').forEach(updateSpiritOpenAvailability);
  }

  function updateBeerAvailability(itemBlock){
    var itemKey = itemBlock.dataset.itemKey;
    var ref = REFS.beer[itemKey] || {empty:0, full:0, liters:0};
    var ok = hasBeerRef(ref);
    itemBlock.querySelectorAll(".input-kg").forEach(function(inp){
      inp.disabled = !ok;
      inp.placeholder = ok ? "0.00" : "Not available";
      if (!ok) inp.value = "";
    });
  }
  function refreshAllBeerAvailability(){
    document.querySelectorAll('#categories-report .cat-card--beer .item-block').forEach(updateBeerAvailability);
  }

  function updateGarnishAvailability(itemBlock){
    var itemKey = itemBlock.dataset.itemKey;
    var ref = REFS.garnish[itemKey];
    var ok = !!ref && (ref.full || 0) > 0;
    itemBlock.querySelectorAll(".input-kg").forEach(function(inp){
      inp.disabled = !ok;
      inp.placeholder = ok ? "0.00" : "Not available";
      if (!ok) inp.value = "";
    });

    document.querySelectorAll('#categories-report .cat-card--garnish .item-block[data-kind="box"]').forEach(updateGarnishAvailability);

  function formatDate(iso){
    if (!iso) return "No date set";
    var parts = iso.split("-");
    return parts.length === 3 ? (parts[1] + "/" + parts[2] + "/" + parts[0]) : iso;
  }
  function refreshMeta(){
    metaDate.textContent = formatDate(elDate.value);
  }
  elDate.addEventListener("input", function(){ refreshMeta(); saveDraft(); });
  if (!elDate.value) elDate.value = new Date().toISOString().slice(0,10);
  refreshMeta();

  function sumBoxItem(item){
    var block = catsReportEl.querySelector('[data-item-key="' + item.key + '"]');
    var total = 0;
    block.querySelectorAll(".input-kg").forEach(function(inp){ total += parseFloat(inp.value) || 0; });

  }

  function calcBagItem(item){
    var block = catsReportEl.querySelector('[data-item-key="' + item.key + '"]');
    var count = 0;
    block.querySelectorAll(".input-bag-count").forEach(function(inp){ count += parseFloat(inp.value) || 0; });
    return {name:item.name, value:count, unit:"bags", flagged:false};
  }

  function calcEaCountItem(item){
    var block = catsReportEl.querySelector('[data-item-key="' + item.key + '"]');
    var count = 0;
    block.querySelectorAll(".input-eacount").forEach(function(inp){ count += parseFloat(inp.value) || 0; });
    return {name:item.name, value:count, unit:"EA", flagged:false};
  }

  function calcEaBoxItem(item){
    var block = catsReportEl.querySelector('[data-item-key="' + item.key + '"]');
    var total = 0;
    block.querySelectorAll(".input-ea-count").forEach(function(inp){ total += parseFloat(inp.value) || 0; });
    block.querySelectorAll(".input-box6-count").forEach(function(inp){ total += (parseFloat(inp.value) || 0) * 6; });
    return {name:item.name, value:total, unit:"EA", flagged:false};
  }

  function beerVolumeForRow(currentWeight, ref){
    var capacity = (ref.full || 0) - (ref.empty || 0);
    var liters = ref.liters || 0;
    if (currentWeight <= 0) return {volume:0, calibrated:true};
    if (capacity > 0 && liters > 0){
      var liquid = currentWeight - (ref.empty || 0);
      var fraction = clamp(liquid / capacity, 0, 1);
      return {volume: fraction * liters, calibrated:true};
    }
    if (ref.empty > 0){
      return {volume: Math.max(currentWeight - ref.empty, 0), calibrated:false};
    }
    return {volume: currentWeight / DENSITY_KG_PER_L, calibrated:false};
  }

  function calcBeerItem(item){
    var block = catsReportEl.querySelector('[data-item-key="' + item.key + '"]');
    var ref = REFS.beer[item.key] || {empty:0, full:0, liters:0};
    var total = 0, calibrated = true, anyWeight = false;
    block.querySelectorAll(".input-kg").forEach(function(inp){
      var w = parseFloat(inp.value) || 0;
      if (w > 0) anyWeight = true;
      var r = beerVolumeForRow(w, ref);
      total += r.volume;
      if (!r.calibrated) calibrated = false;
    });
    return {name:item.name, value: total, unit:"L", flagged: anyWeight && !calibrated};
  }

  function calcSpiritItem(item){
    var block = catsReportEl.querySelector('[data-item-key="' + item.key + '"]');
    var total = 0, flagged = false;
    block.querySelectorAll(".bottle-group").forEach(function(row){
      var closedSizeVal = row.querySelector(".input-closed-size").value;
      var closedSizeLiters = parseFloat(closedSizeVal) || 0;
      var count = parseFloat(row.querySelector(".input-closed-count").value) || 0;
      total += count * closedSizeLiters;

      var openSizeVal = row.querySelector(".input-open-size").value;
      var openSizeLiters = parseFloat(openSizeVal) || 0;
      var openWeight = parseFloat(row.querySelector(".input-open-kg").value) || 0;
      var openCount = parseFloat(row.querySelector(".input-open-count").value) || 0;
      if (openWeight > 0 && openCount <= 0) openCount = 1;
      if (openWeight > 0){
        var ref = (REFS.spirits[item.key] && REFS.spirits[item.key][openSizeVal]) || {empty:0, full:0};
        var capacity = ((ref.full || 0) - (ref.empty || 0)) * openCount;
        if (capacity > 0){
          var liquid = openWeight - (ref.empty || 0) * openCount;
          var fraction = clamp(liquid / capacity, 0, 1);
          total += fraction * openSizeLiters * openCount;
        } else {
          flagged = true;
        }
      }
    });
    return {name:item.name, value: total, unit:"L", flagged: flagged};
  }

  var lastResults = null;

  function buildResultRow(row){
    var rEl = h("div", {class:"result-row"});
    var nameWrap = h("span", {});
    nameWrap.appendChild(document.createTextNode(row.name));
    if (row.flagged) nameWrap.appendChild(h("span", {class:"flag", text:"Set reference weights in Setup for an exact value"}));
    rEl.appendChild(nameWrap);
    var v = h("span", {class:"rv"});
    v.textContent = fmt(row.value) + " " + row.unit;
    rEl.appendChild(v);
    return rEl;
  }

  function buildResultCard(title, dotClass, rows){
    var card = h("div", {class:"result-card"});
    var head = h("h2", {});
    head.appendChild(h("span", {class:"dot " + dotClass}));
    head.appendChild(document.createTextNode(title));
    card.appendChild(head);
    rows.forEach(function(row){ card.appendChild(buildResultRow(row)); });
    return card;
  }

  function calcAll(){
    var spiritRows = SPIRIT_ITEMS.map(calcSpiritItem);

    var garnishRows = GARNISH_ITEMS.map(function(item){
      if (item.kind === "bag") return calcBagItem(item);
      if (item.kind === "eacount") return calcEaCountItem(item);
      var kg = sumBoxItem(item);
      var ref = (REFS.garnish[item.key] && REFS.garnish[item.key].full) || 0;
      var name = item.name + (ref > 0 ? " (≈ " + fmt(kg/ref) + " boxes)" : "");
      return {name:name, value:kg, unit:"kg", flagged:false};
    });

    var juiceRows = JUICE_ITEMS.map(function(item){
      if (item.kind === "eabox") return calcEaBoxItem(item);
      var kg = sumBoxItem(item);
      return {name:item.name, value:kg, unit:"kg", flagged:false};
    });

    var beerRows = BEER_ITEMS.map(calcBeerItem);

    lastResults = {garnish:garnishRows, juices:juiceRows, beer:beerRows, spirits:spiritRows};

    var results = document.getElementById("results");
    results.innerHTML = "";
    results.appendChild(buildResultCard("Alcohol List Check", "dot--spirit", spiritRows));
    results.appendChild(buildResultCard("Fresh Garnish", "dot--garnish", garnishRows));
    results.appendChild(buildResultCard("Juices", "dot--juice", juiceRows));
    results.appendChild(buildResultCard("Keg Beer", "dot--beer", beerRows));

    var exportWrap = h("div", {class:"export-wrap"});
    exportWrap.appendChild(h("button", {type:"button", class:"btn-export", id:"btn-export", text:"Export Excel"}));
    exportWrap.appendChild(h("p", {class:"export-hint", text:"Downloads a workbook with one sheet per category."}));
    results.appendChild(exportWrap);
    document.getElementById("btn-export").addEventListener("click", exportExcel);

    results.hidden = false;
    results.scrollIntoView({behavior:"smooth", block:"start"});
    showToast("Calculation updated");
    saveDraft();
  }

  document.getElementById("btn-calc").addEventListener("click", calcAll);

  document.getElementById("btn-reset").addEventListener("click", function(){
    catsReportEl.querySelectorAll(".item-block").forEach(function(block){
      var rowsEl = block.querySelector("[data-rows]");
      rowsEl.innerHTML = "";
      var key = block.dataset.itemKey, kind = block.dataset.kind, label = block.dataset.label;
      if (kind === "spirit"){
        rowsEl.appendChild(spiritRow(key, ALCOHOL_AREAS[0].key));
        renumberSpiritRows(rowsEl);
      } else {
        var rowFn = rowFactory(kind);
        rowsEl.appendChild(rowFn(key, label));
        renumber(rowsEl, label);
      }
    });
    refreshReportAvailability();
    var results = document.getElementById("results");
    results.hidden = true;
    results.innerHTML = "";
    lastResults = null;
    showToast("Report reset");
    saveDraft();
  });

  /* =========================================================
     EXPORT TO EXCEL
     ========================================================= */
  function browserDownload(filename, blob){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      showToast("Excel file downloaded");
    }catch(e){
      showToast("Could not download the file");
    }
  }

  function exportExcel(){
    if (!lastResults || typeof XLSX === "undefined") return;
    var wb = XLSX.utils.book_new();
    function sheetFrom(rows){
      var aoa = [["Item", "Volume"]];
      rows.forEach(function(r){ aoa.push([r.name, fmt(r.value) + " " + r.unit]); });
      return XLSX.utils.aoa_to_sheet(aoa);
    }
    XLSX.utils.book_append_sheet(wb, sheetFrom(lastResults.spirits), "Alcohol List Check");
    XLSX.utils.book_append_sheet(wb, sheetFrom(lastResults.garnish), "Fresh Garnish");
    XLSX.utils.book_append_sheet(wb, sheetFrom(lastResults.juices), "Juices");
    XLSX.utils.book_append_sheet(wb, sheetFrom(lastResults.beer), "Keg Beer");

    var wbout = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    var blob = new Blob([wbout], {type:"application/octet-stream"});
    var filename = "receiving-tool-" + (elDate.value || "report") + ".xlsx";

    if (downloadsCap){
      downloadsCap.save({filename:filename, data:blob}).catch(function(){ browserDownload(filename, blob); });
    } else {
      browserDownload(filename, blob);
    }
  }

  /* =========================================================
     TOAST
     ========================================================= */
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  /* =========================================================
     DRAFT AUTOSAVE (report entries — per-browser convenience)
     ========================================================= */
  var DRAFT_KEY = "receiving-tool-draft-v4";
  var saveTimer = null;

  function serialize(){
    var state = {
      setup: {
        date: elDate.value,
        counter: elCounter.value
      },
      box: {}, spirit: {}, bag: {}, eabox: {}, eacount: {}
    };
    catsReportEl.querySelectorAll('.item-block[data-kind="box"]').forEach(function(block){
      var vals = [];
      block.querySelectorAll(".input-kg").forEach(function(inp){ vals.push(inp.value); });
      state.box[block.dataset.itemKey] = vals;
    });
    catsReportEl.querySelectorAll('.item-block[data-kind="bag"]').forEach(function(block){
      var vals = [];
      block.querySelectorAll(".input-bag-count").forEach(function(inp){ vals.push(inp.value); });
      state.bag[block.dataset.itemKey] = vals;
    });
    catsReportEl.querySelectorAll('.item-block[data-kind="eacount"]').forEach(function(block){
      var vals = [];
      block.querySelectorAll(".input-eacount").forEach(function(inp){ vals.push(inp.value); });
      state.eacount[block.dataset.itemKey] = vals;
    });
    catsReportEl.querySelectorAll('.item-block[data-kind="eabox"]').forEach(function(block){
      var rows = [];
      block.querySelectorAll(".entry-row--juice").forEach(function(row){
        rows.push({
          ea: row.querySelector(".input-ea-count").value,
          box6: row.querySelector(".input-box6-count").value
        });
      });
      state.eabox[block.dataset.itemKey] = rows;
    });
    catsReportEl.querySelectorAll('.item-block[data-kind="spirit"]').forEach(function(block){
      var rows = [];
      block.querySelectorAll(".bottle-group").forEach(function(row){
        rows.push({
          area: row.dataset.area || "hbar",
          openSize: row.querySelector(".input-open-size").value,
          openKg: row.querySelector(".input-open-kg").value,
          openCount: row.querySelector(".input-open-count").value,
          closedSize: row.querySelector(".input-closed-size").value,
          closed: row.querySelector(".input-closed-count").value
        });
      });
      state.spirit[block.dataset.itemKey] = rows;
    });
    return state;
  }

  function saveDraft(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(serialize())); }catch(e){}
    }, 250);
  }

  function restoreDraft(){
    var raw = null;
    try{ raw = localStorage.getItem(DRAFT_KEY); }catch(e){ return; }
    if (!raw) return;
    var state;
    try{ state = JSON.parse(raw); }catch(e){ return; }
    if (!state) return;

    if (state.setup){
      if (state.setup.date) elDate.value = state.setup.date;
      elCounter.value = state.setup.counter || "";
      refreshMeta();
    }
    if (state.box){
      Object.keys(state.box).forEach(function(key){
        var block = catsReportEl.querySelector('[data-item-key="' + key + '"]');
        if (!block) return;
        var rowsEl = block.querySelector("[data-rows]");
        var label = block.dataset.label;
        var vals = state.box[key];
        if (!vals || !vals.length) return;
        rowsEl.innerHTML = "";
        vals.forEach(function(v){
          var row = boxRow(key, label);
          row.querySelector(".input-kg").value = v;
          rowsEl.appendChild(row);
        });
        renumber(rowsEl, label);
      });
    }
    if (state.bag){
      Object.keys(state.bag).forEach(function(key){
        var block = catsReportEl.querySelector('[data-item-key="' + key + '"]');
        if (!block) return;
        var rowsEl = block.querySelector("[data-rows]");
        var label = block.dataset.label;
        var vals = state.bag[key];
        if (!vals || !vals.length) return;
        rowsEl.innerHTML = "";
        vals.forEach(function(v){
          var row = bagRow(key, label);
          row.querySelector(".input-bag-count").value = v;
          rowsEl.appendChild(row);
        });
        renumber(rowsEl, label);
      });
    }
    if (state.eacount){
      Object.keys(state.eacount).forEach(function(key){
        var block = catsReportEl.querySelector('[data-item-key="' + key + '"]');
        if (!block) return;
        var rowsEl = block.querySelector("[data-rows]");
        var label = block.dataset.label;
        var vals = state.eacount[key];
        if (!vals || !vals.length) return;
        rowsEl.innerHTML = "";
        vals.forEach(function(v){
          var row = eaCountRow(key, label);
          row.querySelector(".input-eacount").value = v;
          rowsEl.appendChild(row);
        });
        renumber(rowsEl, label);
      });
    }
    if (state.eabox){
      Object.keys(state.eabox).forEach(function(key){
        var block = catsReportEl.querySelector('[data-item-key="' + key + '"]');
        if (!block) return;
        var rowsEl = block.querySelector("[data-rows]");
        var label = block.dataset.label;
        var rows = state.eabox[key];
        if (!rows || !rows.length) return;
        rowsEl.innerHTML = "";
        rows.forEach(function(r){
          var row = eaBoxRow(key, label);
          row.querySelector(".input-ea-count").value = r.ea || "";
          row.querySelector(".input-box6-count").value = r.box6 || "";
          rowsEl.appendChild(row);
        });
        renumber(rowsEl, label);
      });
    }
    if (state.spirit){
      Object.keys(state.spirit).forEach(function(key){
        var block = catsReportEl.querySelector('[data-item-key="' + key + '"]');
        if (!block) return;
        var rowsEl = block.querySelector("[data-rows]");
        var rows = state.spirit[key];
        if (!rows || !rows.length) return;
        rowsEl.innerHTML = "";
        rows.forEach(function(r){
          var row = spiritRow(key, r.area || "hbar");
          row.querySelector(".input-open-size").value = r.openSize || "0.75";
          row.querySelector(".input-open-kg").value = r.openKg || "";
          row.querySelector(".input-open-count").value = r.openCount || "";
          row.querySelector(".input-closed-size").value = r.closedSize || "0.75";
          row.querySelector(".input-closed-count").value = r.closed || "";
          rowsEl.appendChild(row);
        });
        renumberSpiritRows(rowsEl);
      });
    }
  }
  restoreDraft();
  refreshReportAvailability();

  /* =========================================================
     CAPABILITIES: db (shared reference weights) + downloads
     ========================================================= */
  async function initCapabilities(){
    try{
      if (window.claude && typeof window.claude.use === "function"){
        dbCap = await window.claude.use("db");
        downloadsCap = await window.claude.use("downloads");
      }
    }catch(e){ dbCap = null; downloadsCap = null; }

    if (dbCap){
      setStorageStatus("Reference weights sync automatically across every device that opens this tool.");
      try{
        dbCap.doc("settings/refs").onSnapshot(function(snap){
          if (snap.exists){
            mergeRefs(snap.data());
            renderSetupValues();
          }
        }, function(){ /* keep local values on subscription error */ });
      }catch(e){}
    } else {
      loadRefsLocal();
      renderSetupValues();
      setStorageStatus("Reference weights are saved in this browser only.");
    }
  }
  initCapabilities();
})();
</script>
